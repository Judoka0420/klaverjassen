name: Generate signing keystore (one-off)

# Run this ONCE to create the release signing key used by android.yml.
# It is a workflow_dispatch (manual) job — it never runs on push.
#
# WHY THE ENCRYPTION DANCE: this repo is PUBLIC, and Actions artifacts are readable by
# anyone with repo read access. So we never expose the raw keystore. Instead you set a
# passphrase secret; the job encrypts the keystore's base64 with it and uploads only the
# ciphertext. You decrypt it locally, then paste the result into the signing secrets.
#
# ── STEPS ────────────────────────────────────────────────────────────────────────────────
# 1. Repo → Settings → Secrets and variables → Actions → New secret:
#       KEYSTORE_PASSPHRASE = <pick a strong password>       (this also becomes the key password)
# 2. Actions → "Generate signing keystore (one-off)" → Run workflow.
# 3. Download the run's "keystore-encrypted" artifact and unzip it → release_b64.enc
# 4. In Git-Bash, decrypt (same passphrase you chose in step 1):
#       openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:'YOUR_PASSPHRASE' \
#         -in release_b64.enc -out release.jks.b64
# 5. Add these four repo secrets:
#       ANDROID_KEYSTORE_B64      = <paste the entire contents of release.jks.b64>
#       ANDROID_KEYSTORE_PASSWORD = <YOUR_PASSPHRASE>
#       ANDROID_KEY_ALIAS         = klaverjassen
#       ANDROID_KEY_PASSWORD      = <YOUR_PASSPHRASE>
# 6. (optional) Delete this workflow file and the KEYSTORE_PASSPHRASE secret.
# ──────────────────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and encrypt for delivery
        env:
          PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then
            echo "::error::Set the KEYSTORE_PASSPHRASE secret first (see this file's header)."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore release.jks -alias klaverjassen \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Klaverjassen, O=Shareline, C=HU"
          base64 -w0 release.jks > release.jks.b64
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PASS \
            -in release.jks.b64 -out release_b64.enc
          echo "Keystore generated and encrypted. Download the 'keystore-encrypted' artifact."

      - name: Upload encrypted keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore-encrypted
          path: release_b64.enc
          if-no-files-found: error
